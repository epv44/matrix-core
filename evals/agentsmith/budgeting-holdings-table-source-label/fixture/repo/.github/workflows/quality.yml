name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.txt -r requirements-quality.txt
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run quality:policy
      - run: npx --no-install matrix-core run --full --json
      - uses: actions/upload-artifact@v4
        with:
          name: matrixcore-gate
          path: .quality/completion-gate.json

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash scripts/test.sh deterministic

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run build:webpack

  agentsmith-review:
    if: vars.MATRIXCORE_AGENTSMITH_CI == 'true'
    needs: deterministic-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.txt -r requirements-quality.txt
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npx --no-install matrix-core completion --json

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  plaid-integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PLAID_ENV: sandbox
      PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
      PLAID_SANDBOX_SECRET: ${{ secrets.PLAID_SANDBOX_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash scripts/test.sh plaid
