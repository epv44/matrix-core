narrative:
  summary: Human-reviewed positive case in the cash-snapshot-source-label contract family, plus contribution and holdings-layout coverage.
  trueCodeFlow: The approved UI contract requires cash_snapshot to display as Cash snapshot. The backend emits cash_snapshot, InvestmentDashboard carries it, and HoldingsCard incorrectly maps it to Account balance. ContributionCard, its stub data, and both browser tests are optional feature-coverage targets rather than required finding-path planning targets.
  references:
    - frontend/src/components/InvestmentView.tsx:928
    - frontend/src/lib/api.ts:487
    - frontend/e2e/dashboard.spec.ts:139
    - frontend/e2e/fixtures/stub.ts:411
