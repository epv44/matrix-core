name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:integration:packed
      - run: node dist/core/cli.js run --full --json
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: matrixcore-gate
          path: .quality/completion-gate.json
